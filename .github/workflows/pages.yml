# The gallery site: the gallery page and the viewer, served by GitHub Pages.
name: pages
on:
  push:
    branches: [main]
    paths: [streetview_to_3d/gallery/index.html, streetview_to_3d/visualise/viewer.html, .github/workflows/pages.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: pages
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: mkdir site && cp streetview_to_3d/gallery/index.html streetview_to_3d/visualise/viewer.html site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
