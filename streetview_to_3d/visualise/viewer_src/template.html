<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Streetview · 3D viewer</title>
    <style>
      /* VIEWER_STYLES */
    </style>
    <script type="importmap">
      /* VIEWER_IMPORTS */
    </script>
    <script id="viewer-config" type="application/json">
      {}
    </script>
  </head>
  <body>
    <header>
      <div class="brand">STREETVIEW <span id="scene-name">No scene open</span></div>
      <button id="open-folder">Open scene</button
      ><button id="open-files" class="quiet">Open PLY / files</button>
      <nav aria-label="Interaction mode">
        <button id="inspect" aria-pressed="true">Inspect</button
        ><button id="fly" aria-pressed="false" disabled>Fly</button>
      </nav>
      <button id="toggle-settings" class="quiet" aria-pressed="false" aria-controls="view-panel">
        Settings
      </button>
      <button id="recenter" disabled title="Fit the entire scene (F)">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          aria-hidden="true"
        >
          <path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5" />
          <circle cx="12" cy="12" r="3" /></svg
        >Recenter
      </button>
    </header>
    <div id="workspace">
      <!-- SCENE_MANAGER -->
      <main id="viewport" aria-label="3D viewport">
        <div id="view-panel" class="view-panel" aria-label="View settings" hidden>
          <details id="view-settings" open>
            <summary>View settings</summary>
            <label
              >Point size <output id="point-value">1.0×</output
              ><input id="point-size" type="range" min="-3" max="3" step=".1" value="0"
            /></label>
            <label
              >Flight speed <output id="speed-value">1.0×</output
              ><input id="speed" type="range" min="-3" max="3" step=".1" value="0"
            /></label>
            <label
              >Chase distance <output id="chase-value">1.0×</output
              ><input id="chase" type="range" min=".5" max="2.5" step=".1" value="1"
            /></label>
          </details>
        </div>
        <div id="empty">
          <h1>Street View in 3D</h1>
          <p>Load a scene folder</p>
        </div>
        <div id="flight" hidden>
          <span>WASD to fly · Q/E down/up · Shift boost</span
          ><button id="exit-fly">Exit Fly · Esc</button>
        </div>
        <div id="reticle" hidden></div>
        <div id="notice" role="alert" hidden>
          <span id="notice-text"></span
          ><button id="dismiss-notice" aria-label="Dismiss message">×</button>
        </div>
        <div id="dropzone" hidden>Drop a PLY or scene folder</div>
      </main>
    </div>
    <footer>
      <div class="status">
        <div id="status" role="status">Ready</div>
        <div id="help" class="muted">Drag to orbit · Right-drag to pan · Scroll to zoom</div>
      </div>
    </footer>
    <input id="file" type="file" accept=".ply,.json" multiple hidden /><input
      id="folder"
      type="file"
      webkitdirectory
      multiple
      hidden
    />
    <script>
      window.viewerBootTimer = setTimeout(() => {
        document.getElementById('notice-text').textContent =
          'Viewer did not start. Check your internet connection: Three.js loads from unpkg.com.';
        document.getElementById('notice').hidden = false;
      }, 15000);
    </script>
    <script type="module">
      import '@viewer/app';
    </script>
  </body>
</html>
