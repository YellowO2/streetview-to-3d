<!doctype html>
<html data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.178.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.178.0/examples/jsm/",
          "@sparkjsdev/spark": "https://sparkjs.dev/releases/spark/0.1.10/spark.module.js"
        }
      }
    </script>

    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
      canvas {
        display: block;
      }
      .pano-id {
        font-family: monospace;
        color: oklch(var(--p, 0.6 0.2 250));
      }
      /* Auto theme based on user preference */
      @media (prefers-color-scheme: dark) {
        html:not([data-theme="light"]) {
          color-scheme: dark;
        }
      }
    </style>
  </head>
  <body class="bg-base-200 min-h-screen">
    <div class="navbar bg-base-100 shadow-sm">
      <div class="flex-1">
        <span class="btn btn-ghost text-xl">Google Map → 3D</span>
      </div>
    </div>

    <main class="container mx-auto p-4 max-w-5xl space-y-4">
      <div class="card bg-base-100 shadow-sm">
        <div class="card-body">
          <form id="searchForm" class="space-y-3">
            <div class="join w-full">
              <input
                id="mapsUrlInput"
                type="text"
                class="input input-bordered join-item flex-1"
                placeholder="Paste URL or lat,lon (with /@lat,lon or lat,lon directly)"
                required
              />
              <button type="submit" class="btn btn-primary join-item">
                Load
              </button>
            </div>

            <button
              type="button"
              id="exampleButton"
              class="btn btn-outline btn-sm"
            >
              Use Example Panorama
            </button>
          </form>

          <div role="alert" class="alert alert-info mt-3 py-2">
            <span id="status" class="text-sm">Paste a Google Maps URL to start.</span>
          </div>
        </div>
      </div>

      <section id="treeContainer" class="card bg-base-100 shadow-sm hidden">
        <div class="card-body">
          <h3 class="card-title">
            Discovered Panoramas
            <span id="panoCount" class="badge badge-neutral">(0)</span>
          </h3>

          <div
            id="map"
            class="rounded-box border border-base-300"
            style="height: 400px; width: 100%;"
          ></div>

          <label class="label cursor-pointer justify-start gap-2 mt-2">
            <input type="checkbox" id="depthCheckbox" class="checkbox checkbox-sm" />
            <span class="label-text">Include Depth Maps (.npy format)</span>
          </label>

          <div class="flex flex-wrap gap-3 items-center mt-2">
            <button id="downloadAllBtn" class="btn btn-outline">
              Download All Discovered
            </button>
            <button id="generateBtn" class="btn btn-primary">
              Generate 3DGS
            </button>
            <select
              id="scaleModeSelect"
              class="select select-bordered select-sm w-auto"
            >
              <option value="da3_2dgrid_global">Scale: 2D Grid (default)</option>
              <option value="da3_y_ground">Scale: Ground Plane</option>
            </select>
          </div>

          <div
            id="downloadSplatContainer"
            class="alert alert-success hidden mt-3 flex-col items-start"
          >
            <h4 class="font-semibold">3DGS Output Files</h4>
            <ul id="plyFileList" class="list-none p-0 m-0 font-mono text-sm space-y-1"></ul>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
