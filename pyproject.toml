[build-system]
requires = ["setuptools>=62.3"]  # 62.3: recursive ** in package-data
build-backend = "setuptools.build_meta"

[project]
name = "streetview-to-3d"
version = "0.1.0"
description = "Reconstruct a street from Street View panoramas into a placed 3D point cloud"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "scipy",
    "shapely",
    "mapbox-vector-tile",  # OpenFreeMap's tiles, when Overpass gives no answer (postprocess/world/openfreemap.py)
    "opencv-python",
    "aiohttp",
    "pillow",
    "huggingface_hub",
    "gradio",
    "spaces",
    "transformers",  # the car/person segmenter (models.segment)
    "torchvision",   # its SegFormer image processor
    # depth_anything_3 imports these without declaring them
    "addict",
    "tqdm",
    "streetlevel @ git+https://github.com/YellowO2/streetlevel.git",
    "panoramic-da3 @ git+https://github.com/YellowO2/panoramic-da3.git",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["streetview_to_3d*"]
namespaces = false

[tool.setuptools.package-data]
"streetview_to_3d.visualise" = ["viewer.html", "viewer_src/**/*"]

"streetview_to_3d.postprocess.world._vendor.osm_building_grammar" = ["LICENSE", "PROVENANCE.md"]
